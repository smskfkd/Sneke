
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>へびゲーム</title>
<style>
body{background:#101827;color:white;text-align:center;font-family:sans-serif}
h1{color:#55ed91}
canvas{width:min(90vw,420px);height:min(90vw,420px);background:#1c2939;border:3px solid #55ed91;border-radius:12px}
button{background:#35d879;border:0;border-radius:12px;padding:14px;margin:5px;font-size:20px;font-weight:bold}
.info{font-size:20px;margin:15px}
.pad{display:grid;grid-template-columns:repeat(3,65px);justify-content:center}
</style>
</head>
<body>
<h1>🐍 へびゲーム</h1>
<div class="info">スコア：<span id="score">0</span>　最高：<span id="best">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<p id="msg">スタートを押してね！</p>
<button onclick="start()">スタート / リスタート</button>
<div class="pad">
<span></span><button onclick="turn(0,-1)">⬆️</button><span></span>
<button onclick="turn(-1,0)">⬅️</button>
<button onclick="turn(0,1)">⬇️</button>
<button onclick="turn(1,0)">➡️</button>
</div>
<p>矢印キーでも操作できるよ！</p>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let snake,food,dir,next,score=0,best=Number(localStorage.getItem("snakeBest")||0),timer,running=false;
document.getElementById("best").textContent=best;
function makeFood(){
 let p;
 do{p={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}
 while(snake.some(s=>s.x===p.x&&s.y===p.y));
 return p;
}
function start(){
 clearInterval(timer);
 snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];
 dir={x:1,y:0};next={x:1,y:0};score=0;
 document.getElementById("score").textContent=0;
 document.getElementById("msg").textContent="エサを食べよう！";
 food=makeFood();running=true;draw();timer=setInterval(move,120);
}
function turn(x,y){
 if(!running||x===-dir.x&&y===-dir.y)return;
 next={x,y};
}
document.addEventListener("keydown",e=>{
 const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
 if(k[e.key]){e.preventDefault();turn(...k[e.key]);}
});
function move(){
 dir=next;
 let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 let eat=h.x===food.x&&h.y===food.y;
 if(h.x<0||h.x>=20||h.y<0||h.y>=20||snake.slice(0,eat?undefined:-1).some(s=>s.x===h.x&&s.y===h.y)){
 running=false;clearInterval(timer);
 document.getElementById("msg").textContent="💀ゲームオーバー！スコア："+score;
 return;
 }
 snake.unshift(h);
 if(eat){
 score+=10;
 document.getElementById("score").textContent=score;
 if(score>best){best=score;localStorage.setItem("snakeBest",best);document.getElementById("best").textContent=best;}
 food=makeFood();
 }else snake.pop();
 draw();
}
function draw(){
 ctx.fillStyle="#1c2939";ctx.fillRect(0,0,400,400);
 ctx.fillStyle="#ff5252";ctx.beginPath();ctx.arc(food.x*20+10,food.y*20+10,8,0,Math.PI*2);ctx.fill();
 snake.forEach((s,i)=>{
 ctx.fillStyle=i===0?"#a4ffb7":"#35d879";
 ctx.fillRect(s.x*20+1,s.y*20+1,18,18);
 if(i===0){ctx.fillStyle="#153b29";ctx.fillRect(s.x*20+5,s.y*20+5,3,3);ctx.fillRect(s.x*20+12,s.y*20+5,3,3);}
 });
}
draw();
</script>
</body>
</html>
